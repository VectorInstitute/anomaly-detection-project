[project]
name = "anomaly-detection-project"
version = "0.0.1"
description = "Anomaly Detection Bootcamp Project"
authors = [{name = "Vector AI Engineering", email = "ai_engineering@vectorinstitute.ai"}]
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = "~=3.8.0"
dependencies = [
    "torch-sparse~=0.6.17",
    "numpy~=1.21.6",
    "pandas~=1.3.5",
    "tqdm~=4.64.1",
    "torch~=1.13.0",
    "scikit-learn~=1.0.2",
    "delu~=0.0.13",
    "torch-geometric~=2.3.1",
    "scipy~=1.7.3",
    "rtdl~=0.0.13",
    "xgboost~=1.6.2",
    "pyod~=1.0.9",
    "anomalib~=0.6.0",
    "ipython~=7.31.1",
    "gitpython~=3.1.32",
    "lightgbm~=3.3.5",
    "catboost~=1.2",
    "pytorch-tabnet~=4.1.0",
    "aequitas~=0.42.0",
    "matplotlib~=3.5.2",
    "glob2~=0.7",
    "opencv-python~=4.8.0.74",
    "torchvision~=0.14.0",
    "pillow~=9.2.0",
    "setuptools",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.isort]
multi_line_output = 10
skip_gitignore = true
use_parentheses = true

[tool.black]
line-length = 79
